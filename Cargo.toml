[package]
name = "rain-night-lyrics"
version = "0.2.0"
edition = "2024"
publish = false
description = "Windows synchronized lyrics companion for the Rain Night Wallpaper Engine scene"

[dependencies]
base64 = "0.22"
regex = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.4", features = ["json"] }
windows = { version = "0.58", features = ["Foundation", "Media_Control", "Win32_Foundation", "Win32_Media_Audio_Endpoints", "Win32_Security", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_Shell_PropertiesSystem", "implement"] }
windows-core = "0.58"

[profile.release]
strip = true
lto = "thin"

