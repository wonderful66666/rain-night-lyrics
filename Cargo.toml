[package]
name = "rain-night-lyrics"
version = "0.3.0"
edition = "2024"
publish = false
description = "Windows synchronized lyrics companion for the Rain Night Wallpaper Engine scene"

[dependencies]
base64 = "0.22"
regex = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "3.4", features = ["json"] }
windows = { version = "0.58", features = [
    "Foundation", "Foundation_Numerics", "Media_Control", "Storage_Streams",
    "Win32_Devices_Display", "Win32_Foundation", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging",
    "Win32_Media_Audio_Endpoints", "Win32_Security", "Win32_System_Com",
    "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_WinRT",
    "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "implement",
] }
windows-core = "0.58"

[profile.release]
strip = true
lto = "thin"

